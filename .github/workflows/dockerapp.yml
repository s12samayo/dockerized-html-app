name: Build Push and Deploy Docker App

on:
  push:
    branches:
      - feature/branch

jobs:
  deploy:
    runs-on: [self-hosted, sam]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install and Verify Docker
        run: |
          echo "Checking Docker..."
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi
          docker --version

      - name: Grant Docker Permission
        run: |
          echo "Granting Docker permission..."
          sudo chmod 666 /var/run/docker.sock || true

      - name: Login to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-dockerized-app:latest .

      - name: Show Docker Images
        run: |
          echo "Available Docker images:"
          docker images

      - name: Push Image to Docker Hub
        run: |
          echo "Pushing image to Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-dockerized-app:latest

      - name: Stop and Remove Old Container
        run: |
          echo "Stopping old container if it exists..."
          docker stop my-dockerized-app || true
          docker rm my-dockerized-app || true

      - name: Run New Container
        run: |
          echo "Starting new container..."
          docker run -d --name my-dockerized-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/my-dockerized-app:latest

      - name: Check Running Containers
        run: |
          echo "Checking running containers..."
          docker ps
          docker ps -a